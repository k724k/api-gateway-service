server:
  port: 8000
  
spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8080
              predicates:
                - Path=/api/users/**
              filters:
                - RewritePath=/api/users/(?<segment>.*), /api/users/${segment}

            - id: user-service-docs
              uri: http://localhost:8080
              predicates:
                - Path=/user-service/v3/api-docs
              filters:
                - RewritePath=/user-service/v3/api-docs, /v3/api-docs

            - id: board-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/boards/**
              filters:
                - RewritePath=/api/boards/(?<segment>.*), /api/boards/${segment}

            - id: board-service-docs
              uri: http://localhost:8081
              predicates:
                - Path=/board-service/v3/api-docs
              filters:
                - RewritePath=/board-service/v3/api-docs, /v3/api-docs

jwt:
  secret: jscode-secret-1234-1234-1234-1234

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: user-service
        url: /user-service/v3/api-docs
      - name: board-service
        url: /board-service/v3/api-docs
